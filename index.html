<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quezior | Biolink</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1559253664-ca249d4608c6?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: grayscale(100%) brightness(0.25) contrast(1.3);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.92) 100%);
            z-index: -1;
        }

        /* Overlay do wejścia */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay-card {
            background: rgba(10, 10, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 45px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .overlay-card:hover {
            transform: scale(1.03);
        }

        .overlay-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .overlay-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .overlay-sub {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8c90a4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: filter 0.8s ease, transform 0.8s ease;
            filter: blur(10px);
            transform: scale(0.98);
        }

        .container.active {
            filter: blur(0);
            transform: scale(1);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            margin-bottom: 5px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .time-badge {
            background: rgba(12, 12, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .lang {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .grid-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 650px) {
            .grid-top { grid-template-columns: 1fr; }
        }

        .card {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .card-header {
            font-size: 0.75rem;
            font-weight: 800;
            color: #8c90a4;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar-container {
            position: relative;
            width: 55px;
            height: 55px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #0a0a0c;
            background: #747f8d;
        }

        .status-dot.online { background: #43b581; box-shadow: 0 0 8px #43b581; }
        .status-dot.idle { background: #faa61a; box-shadow: 0 0 8px #faa61a; }
        .status-dot.dnd { background: #f04747; box-shadow: 0 0 8px #f04747; }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .status-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8c90a4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #8c90a4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .telegram-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .tg-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tg-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3);
        }

        .arrow-btn {
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .song-main {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cover-art {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #111;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
        }

        .song-title-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .song-artist-text {
            color: #8c90a4;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .playlist {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8c90a4;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #ccc;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .ctrl-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

        .play-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            color: #000000;
            font-size: 1.25rem;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .play-main:hover { transform: scale(1.05); background: #e6e6e6; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="enterSite()">
    <div class="overlay-card">
        <div class="overlay-icon"><i class="fas fa-play"></i></div>
        <div class="overlay-title"><i class="fas fa-dollar-sign"></i> <span id="overlay-name">quezior</span></div>
        <div class="overlay-sub">CLICK ANYWHERE TO ENTER</div>
    </div>
</div>

<div class="container" id="main-container">
    <div class="top-bar">
        <div class="logo"><i class="fas fa-dollar-sign"></i> <span id="site-title">quezior</span></div>
        <div class="time-badge"><i class="far fa-clock"></i> <span id="clock">00:00:00</span> <span class="lang">PL</span></div>
    </div>

    <div class="grid-top">
        <div class="card tilt-card">
            <div class="card-header"><i class="fab fa-discord"></i> Discord Profile</div>
            <div class="profile-info">
                <div class="avatar-container">
                    <img id="discord-avatar" class="avatar" src="cover.png" alt="Discord Avatar">
                    <div id="discord-status" class="status-dot"></div>
                </div>
                <div>
                    <div id="discord-username" class="profile-name">quezior</div>
                    <span id="discord-status-text" class="status-text">OFFLINE</span>
                </div>
            </div>
            <div class="activity-box"><i class="far fa-moon"></i> <span id="discord-activity">No current activity</span></div>
        </div>

        <a id="telegram-link" href="https://t.me/quezior" target="_blank" class="card telegram-card tilt-card">
            <div class="tg-left">
                <div class="tg-icon"><i class="fab fa-telegram-plane"></i></div>
                <div>
                    <div class="profile-name">Telegram</div>
                    <div id="telegram-username" style="color: #8c90a4; font-size: 0.9rem; font-weight: 600;">@quezior</div>
                </div>
            </div>
            <div class="arrow-btn"><i class="fas fa-chevron-right"></i></div>
        </a>
    </div>

    <div class="card player-card tilt-card">
        <div class="player-top">
            <div class="player-badge"><i class="fas fa-music"></i> AUDIO PLAYER</div>
            <span style="color: #8c90a4; font-size: 0.8rem; font-weight: 700;">1 / 1</span>
        </div>

        <div class="song-main">
            <img id="cover-art" src="cover.png" class="cover-art" alt="Cover" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div>
                <div class="song-title-text" id="song-title">blikoman</div>
                <div class="song-artist-text" id="song-artist">hakerzy.pl</div>
            </div>
        </div>

        <div class="playlist">
            <div class="track-item">01. blikoman</div>
        </div>

        <div class="progress-area">
            <div class="progress-bar" id="progress-container">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="time-labels">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="restartTrack()"><i class="fas fa-redo-alt"></i></button>
            <button class="ctrl-btn play-main" id="playBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
        </div>

        <audio id="audio" src="blikoman.mp3"></audio>
    </div>
</div>

<script>
    const CONFIG = {
        siteTitle: "quezior",              
        telegramUsername: "@quezior",       
        telegramLink: "https://t.me/quezior",
        discordID: ""
    };

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    let entered = false;

    document.getElementById('site-title').innerText = CONFIG.siteTitle;
    document.getElementById('overlay-name').innerText = CONFIG.siteTitle;
    document.getElementById('telegram-username').innerText = CONFIG.telegramUsername;
    document.getElementById('telegram-link').href = CONFIG.telegramLink;

    function enterSite() {
        if (entered) return;
        entered = true;
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('main-container').classList.add('active');
        togglePlay();
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !entered) {
            enterSite();
        }
    });

    function togglePlay() {
        if (audio.paused) {
            audio.play().then(() => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(e => console.log("Błąd odtwarzania:", e));
        } else {
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
    }

    function restartTrack() {
        audio.currentTime = 0;
    }

    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = `${pct}%`;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        }
    };

    document.getElementById('progress-container').onclick = (e) => {
        const rect = e.target.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    };

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Efekt obracania kart (Tilt 3D)
    document.querySelectorAll('.tilt-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });
    });
</script>

</body>
</html>
